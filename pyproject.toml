[project]
name = "tibber-mcp-server"
version = "0.2.0"
description = "MCP-Server für die Tibber-API: Preise, Verbrauch, Pulse-Live-Daten"
license = { text = "MIT" }
authors = [{ name = "Jürgen Schilling" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.5",
    "httpx==0.28.1",
    "pyTibber==0.37.6",
    "aiohttp==3.14.3",
]

[project.urls]
Repository = "https://github.com/Schimmilab/tibber-mcp-server"

[project.scripts]
tibber-mcp = "tibber_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tibber_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
