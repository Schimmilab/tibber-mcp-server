name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest

      # Smoke-Test: startet den Server wirklich und spricht das MCP-Protokoll
      # (initialize -> tools/list). pytest beantwortet nicht, ob der Server
      # nach einer Frischinstallation ueberhaupt laeuft; ein Import-Test auch
      # nicht, weil Tools in Dekoratoren registriert werden.
      # Anlass: 30.07.2026 sechs Server aufs neue SDK umgestellt und gemerged,
      # am 31.07. waren fuenf tot - die CI hatte nichts gemerkt.
      - name: MCP-Smoke
        uses: Schimmilab/mcp-smoke-action@v1
        with:
          command: uv run tibber-mcp
          min-tools: "7"
